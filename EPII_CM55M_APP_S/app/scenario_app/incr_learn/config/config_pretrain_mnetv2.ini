[settings]
dataset = cifar100
base_class = 5

block_architecture = mnetv2_x4
random_seed = 8

max_train_iter = 200
learning_rate = 0.025
batch_size = 128

optimizer = SGD
SGDnesterov = True
SGDweight_decay = 0.0005
SGDmomentum = 0.9

representation = real
dim_features = 256
advance_augment = True

width_mult = 1.0
round_nearest = 1

dropout = true
dropout_rate = 0.0

lambda_ortho = 0.5