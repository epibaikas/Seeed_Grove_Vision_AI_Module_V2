[settings]
dataset = cifar100
num_classes = 100
base_class = 60
num_workers = 8

block_architecture = mnetv2_x4
random_seed = 8

max_train_iter = 200
learning_rate = 0.025
batch_size = 128

optimizer = SGD
SGDnesterov = True
SGDweight_decay = 0.0005
SGDmomentum = 0.9

scheduler_min_lr_scaler = 0.01
scheduler_type = CosineAnnealing
scheduler_warmup_step = 100

representation = real
dim_features = 256
advance_augment = True

width_mult = 1.0
round_nearest = 1

dropout = true
dropout_rate = 0.0

lambda_ortho = 0.5